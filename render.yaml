# Frontend React/Vite — Static Site (100% gratuit sur Render)
services:
  - type: web
    name: mavilla-web
    runtime: static
    buildCommand: cd Ma-Villa && npm install && npm run build
    staticPublishPath: ./Ma-Villa/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false   # à définir manuellement : https://<ton-backend>.railway.app/api
