databases:
  - name: mavilla-db
    plan: free
    databaseName: mavilla
    user: mavilla

services:
  # ── Backend Laravel ───────────────────────────────────────────
  - type: web
    name: mavilla-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: "Ma Villa"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        fromService:
          type: web
          name: mavilla-api
          property: host
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: mavilla-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: mavilla-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: mavilla-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: mavilla-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: mavilla-db
          property: password
      - key: FILESYSTEM_DISK
        value: public
      - key: SESSION_DRIVER
        value: cookie
      - key: CACHE_STORE
        value: array
      - key: QUEUE_CONNECTION
        value: sync

  # ── Frontend React/Vite ───────────────────────────────────────
  - type: web
    name: mavilla-web
    runtime: static
    buildCommand: cd Ma-Villa && npm ci && npm run build
    staticPublishPath: ./Ma-Villa/dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false   # à définir manuellement dans le dashboard après le déploiement du backend
