services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mavilla_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    networks:
      - mavilla_network
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: mavilla_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - mavilla_network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: mavilla_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mavilla
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: secret
      MYSQL_USER: mavilla
    ports:
      - "3306:3306"
    volumes:
      - mavilla_db_data:/var/lib/mysql
    networks:
      - mavilla_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: mavilla_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root
    networks:
      - mavilla_network
    depends_on:
      - db

networks:
  mavilla_network:
    driver: bridge

volumes:
  mavilla_db_data:
