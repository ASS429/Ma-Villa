<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` étend la page sous l'encoche et la barre de
         gestes ; `env(safe-area-inset-*)` remet ensuite les marges là où il
         faut. Sans lui, une application installée sur iPhone garde deux
         bandeaux blancs et ne ressemble plus à une application. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>PasseTemps — Location de villas au Sénégal</title>
    <meta
      name="description"
      content="Louez une villa, une résidence, un appartement ou une chambre au Sénégal — Saly, Mbour, Dakar. Tarifs affichés, disponibilités en temps réel, réservation directe auprès des propriétaires."
    />
    <!-- La couleur de la barre système suit le thème : une barre claire
         au-dessus d'une application sombre trahit immédiatement le site web. -->
    <meta name="theme-color" content="#F7F4EF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0C0A08" media="(prefers-color-scheme: dark)" />

    <!-- Application installable -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="application-name" content="PasseTemps" />

    <!-- iOS n'implémente pas le manifeste : sans ces trois balises, l'icône
         posée sur l'écran d'accueil ouvre Safari avec sa barre d'adresse. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PasseTemps" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Aperçu de partage : c'est ce qui s'affiche quand un lien est envoyé
         sur WhatsApp, le principal canal de diffusion sur ce marché. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PasseTemps" />
    <meta property="og:title" content="PasseTemps — Location de villas au Sénégal" />
    <meta property="og:description" content="Villas, résidences, appartements et chambres à Saly, Mbour et Dakar. Tarifs affichés, réservation directe." />
    <!-- URL absolue : les robots de partage (WhatsApp, Facebook) résolvent mal
         les chemins relatifs. Vite remplace %VITE_SITE_URL% à la compilation ;
         la valeur par défaut est dans .env.production. -->
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.jpg" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:locale" content="fr_SN" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Le `.ico` d'abord : les navigateurs et les robots qui ne lisent pas
         ces balises demandent `/favicon.ico` par convention, et recevaient
         jusqu'ici la page entière étiquetée comme une icône. Il porte trois
         tailles — onglet, barre de favoris, bureau. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      // Pose le thème avant le premier rendu. Sans cela, un appareil réglé en
      // sombre affiche un éclair de thème clair le temps que React monte.
      // Même règle que ThemeContext : choix enregistré, sinon préférence système.
      (function () {
        try {
          var choix = localStorage.getItem('theme')
          var sombre = choix === 'dark' || (!choix &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.setAttribute('data-theme', sombre ? 'dark' : 'light')
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
    <div id="root"></div>
    <noscript>
      PasseTemps nécessite JavaScript pour fonctionner. Veuillez l'activer dans votre navigateur.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
